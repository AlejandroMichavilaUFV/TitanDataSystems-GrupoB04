<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Perfil - Titán Data Systems</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='profile.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- Barra lateral -->
        <div class="sidebar">
            <div class="brand">
                <img src="{{ url_for('static', filename='media/logo.png') }}" alt="Logo" class="logo">
            </div>
            <nav class="nav-menu">
                <a href="{{ url_for('profile') }}" class="nav-item active">
                    <i class="fas fa-inbox"></i> Correos
                </a>
                <a href="{{ url_for('chat') }}" class="nav-item">
                    <i class="fas fa-comments"></i> Chat
                </a>
            </nav>
            <div class="user-profile">
                <img src="{{ profile.picture }}" alt="Perfil" class="profile-pic">
                <div class="user-info">
                    <span class="user-name">{{ profile.name }}</span>
                    <a href="{{ url_for('logout') }}" class="logout-btn">Cerrar sesión</a>
                </div>
            </div>
        </div>

        <!-- Contenido principal -->
        <div class="main-content">
            <div class="toolbar">
                <div class="search-bar">
                    <i class="fas fa-search"></i>
                    <input type="text" placeholder="Buscar en correos">
                </div>
            </div>

            <div class="email-list">
                {% for email in emails %}
                <div class="email-item" onclick="openEmailModal('{{ email.id }}')">
                    <div class="email-header">
                        <div class="sender-info">
                            <div class="sender-details">
                                <h3>{{ email.subject }}</h3>
                                <p class="sender-name">{{ email.sender }}</p>
                            </div>
                        </div>
                        <div class="email-meta">
                            <div class="date-container">
                                <div class="email-date">{{ email.date }}</div>
                            </div>
                            {% if email.attachments %}
                            <div class="attachment-tag">
                                {{ email.attachments|length }} adjunto{{ 's' if email.attachments|length != 1 else '' }}
                            </div>
                            {% endif %}
                        </div>
                    </div>
                </div>
                {% endfor %}
            </div>
        </div>
    </div>

    <!-- Modal para ver el correo completo -->
    <div id="email-modal" class="modal">
        <div class="modal-content">
            <span class="close-button" onclick="closeEmailModal()">&times;</span>
            <div class="email-full-view">
                <div class="email-header">
                    <h2 id="modal-subject"></h2>
                    <div class="email-details">
                        <div class="sender-info">De: <span id="modal-sender"></span></div>
                        <div class="receiver-info">Para: <span id="modal-receiver"></span></div>
                        <div class="date-info">
                            <span id="modal-date"></span>
                        </div>
                    </div>
                </div>
                <div class="email-body" id="modal-body"></div>
                <div class="attachments" id="modal-attachments"></div>
            </div>
        </div>
    </div>

    <script>
        async function openEmailModal(emailId) {
            try {
                const response = await fetch(`/api/email/${emailId}`);
                const email = await response.json();
                
                document.getElementById('modal-subject').textContent = email.subject;
                document.getElementById('modal-sender').textContent = email.sender;
                document.getElementById('modal-receiver').textContent = email.receiver;
                document.getElementById('modal-date').textContent = email.date;
                document.getElementById('modal-body').innerHTML = email.body.replace(/\n/g, '<br>');
                
                const attachmentsContainer = document.getElementById('modal-attachments');
                attachmentsContainer.innerHTML = '';
                
                if (email.attachments && email.attachments.length > 0) {
                    email.attachments.forEach(attachment => {
                        const attachmentDiv = document.createElement('div');
                        attachmentDiv.className = 'attachment-item';
                        attachmentDiv.innerHTML = `
                            <i class="fas fa-${getAttachmentIcon(attachment.mimeType)}"></i>
                            <span class="filename">${attachment.filename}</span>
                            <span class="filesize">${formatFileSize(attachment.size)}</span>
                            <button onclick="downloadAttachment('${attachment.id}')">
                                <i class="fas fa-download"></i>
                            </button>
                        `;
                        attachmentsContainer.appendChild(attachmentDiv);
                    });
                }
                
                document.getElementById('email-modal').style.display = 'flex';
            } catch (error) {
                console.error('Error:', error);
            }
        }

        function closeEmailModal() {
            document.getElementById('email-modal').style.display = 'none';
        }

        function getAttachmentIcon(mimeType) {
            if (mimeType.startsWith('image/')) return 'file-image';
            if (mimeType === 'application/pdf') return 'file-pdf';
            if (mimeType.includes('spreadsheet')) return 'file-excel';
            if (mimeType.includes('document')) return 'file-word';
            return 'file';
        }

        function formatFileSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
        }

        async function downloadAttachment(attachmentId) {
            try {
                const response = await fetch(`/api/attachment/${attachmentId}`);
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = attachmentId.split(':')[2]; // Obtener el nombre del archivo del ID
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
                a.remove();
            } catch (error) {
                console.error('Error:', error);
            }
        }
    </script>
</body>
</html>
